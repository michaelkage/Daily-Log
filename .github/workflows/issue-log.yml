name: Save daily log issue

on:
  issues:
    types: [closed]

permissions:
  contents: write
  issues: read

concurrency:
  group: daily-log-automation
  cancel-in-progress: false

jobs:
  save-entry:
    if: startsWith(github.event.issue.title, 'Daily log:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Append issue answers to daily entry
        run: node scripts/issue-to-log.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
      - name: Rebuild dashboard
        run: node scripts/generate-dashboard.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
